<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quillmark">
<meta name="theme-color" content="#0B0C0E">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<title>Quillmark</title>
<link rel="apple-touch-icon" id="touchIcon" href="data:,">
<style>
/* ===== Design-System: dunkles Milchglas (Schwarz/Grau), Pillen-Formen, weißer Akzent ===== */
:root{
  color-scheme:dark;
  --bg:#0B0C0E;
  --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.09); --glass-3:rgba(255,255,255,.14);
  --glass-strong:rgba(26,27,31,.82); --field:rgba(0,0,0,.28);
  --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.16); --hi:rgba(255,255,255,.08);
  --text:#F4F4F5; --muted:#A1A1AA; --dim:#71717A;
  --accent:#F4F4F5; --on-accent:#0B0C0E;
  --ok:#4ADE80; --warn:#FBBF24; --err:#F87171;
  --r:24px; --r-s:14px; --tap:44px;
  --blur:blur(22px) saturate(140%);
  --shadow:0 12px 40px rgba(0,0,0,.38);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);background:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
h1,h2,h3,h4,p{margin:0}
svg{display:block;flex:none}
:focus-visible{outline:2px solid rgba(255,255,255,.7);outline-offset:2px}
::selection{background:rgba(255,255,255,.25)}

/* Hintergrund: weiche, unscharfe Grauflächen hinter dem Glas */
.bg{position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:
  radial-gradient(34% 40% at 10% 14%,rgba(170,174,186,.42),transparent 70%),
  radial-gradient(36% 44% at 92% 86%,rgba(130,134,146,.46),transparent 70%),
  radial-gradient(26% 30% at 64% 22%,rgba(220,222,230,.16),transparent 70%),
  radial-gradient(40% 36% at 28% 96%,rgba(96,98,108,.50),transparent 70%),
  radial-gradient(30% 34% at 52% 58%,rgba(60,62,70,.40),transparent 70%),var(--bg);filter:blur(36px)}

/* Glas-Grundfläche */
.glass,.card,.rail,.pill,.pop,.modal-card{background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035));border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi),var(--shadow);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}

/* ---------- App-Rahmen ---------- */
.app{display:flex;height:100%;gap:0}
.shell{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}

/* Seitenleiste (wie „Side Navigation“): Glas-Pille, aktiver Schritt als weißer Kreis */
.rail{flex:none;width:84px;margin:14px 0 calc(14px + env(safe-area-inset-bottom)) 14px;border-radius:42px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0}
.rail .logo{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--glass-3);border:1px solid var(--line-2);margin-bottom:8px}
.rail nav{display:flex;flex-direction:column;gap:10px;align-items:center}
.rail nav button{width:72px;min-height:76px;border:0;background:transparent;border-radius:28px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0;color:var(--muted)}
.rail nav button .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);transition:background .15s,color .15s}
.rail nav button .t-long{font-size:10.5px;font-weight:600;line-height:1.15;text-align:center;max-width:72px}
.rail nav button .t-short{display:none}
.rail nav button:hover .ic{background:var(--glass-2)}
.rail nav button.on{color:var(--text)}
.rail nav button.on .ic{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 6px 20px rgba(255,255,255,.18)}
.rail .grow{flex:1}
.rail .icon-btn{width:52px;height:52px;border-radius:50%;background:var(--glass);border:1px solid var(--line)}

/* Kopfzeile */
.topbar{flex:0 0 68px;height:68px;display:flex;align-items:center;gap:10px;padding:0 18px 0 16px;position:relative;z-index:20}
.title-input{flex:1 1 auto;min-width:60px;max-width:520px;height:48px;border:1px solid transparent;border-radius:16px;background:transparent;padding:0 14px;font-size:22px;font-weight:700;letter-spacing:-.3px;color:var(--text);text-overflow:ellipsis}
.title-input::placeholder{color:var(--dim);font-weight:600}
.title-input:hover{background:var(--glass)}
.title-input:focus{outline:none;border-color:var(--line-2);background:var(--field)}
.topbar .grow{flex:1}
.actions{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-left:auto}

/* Segmented Control (Glas-Pille) */
.seg{display:inline-flex;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;flex:none}
.seg button{min-height:var(--tap);padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:600;font-size:14.5px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:7px}
.seg button.on{background:var(--glass-3);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.seg.fill{display:flex;width:100%}.seg.fill button{flex:1;padding:0 6px}
.seg.small button{font-size:14px}

/* Buttons */
.icon-btn{width:var(--tap);height:var(--tap);flex:none;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;color:var(--text)}
.icon-btn:hover{background:var(--glass-2)}
.icon-btn:disabled{opacity:.3;cursor:default;background:transparent}
.topbar .icon-btn{width:48px;height:48px;background:var(--glass);border:1px solid var(--line)}
.btn{min-height:var(--tap);padding:0 18px;border-radius:16px;border:1px solid var(--line-2);background:var(--glass);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;color:var(--text);box-shadow:inset 0 1px 0 var(--hi)}
.btn:hover{background:var(--glass-2)}
.btn:active{background:var(--glass-3)}
.btn:disabled{opacity:.4;cursor:default}
.btn-primary,.btn-amber{background:var(--accent);border-color:transparent;color:var(--on-accent);box-shadow:0 6px 20px rgba(255,255,255,.10)}
.btn-primary:hover,.btn-amber:hover,.btn-primary:active,.btn-amber:active{background:#fff}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.btn-ghost:hover{background:var(--glass);color:var(--text)}
.btn-danger{color:var(--err);border-color:rgba(248,113,113,.35)}
.btn-block{display:flex;width:100%}
.btn-sm{padding:0 14px;font-size:14px;border-radius:999px}
.cta{padding:0 22px;height:48px;border-radius:999px}
.info{width:var(--tap);height:var(--tap);margin:-10px -10px -10px 0;flex:none;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
.info:hover,.info[aria-expanded=true]{color:var(--text)}

/* ---------- Hauptbereich ---------- */
.subtabs{display:none;padding:0 16px 8px}
main{flex:1 1 auto;min-height:0;display:flex;gap:14px;padding:0 14px calc(14px + env(safe-area-inset-bottom)) 14px}
.panel{flex:0 0 clamp(420px,40vw,580px);min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 4px 24px 2px;scrollbar-width:none}
.panel::-webkit-scrollbar{display:none}
.panel>section{display:flex;flex-direction:column;gap:14px}
.card{border-radius:var(--r);padding:18px}
.card-h{display:flex;align-items:center;gap:8px;min-height:24px;margin-bottom:12px}
.card-h h3,.card h3{font-size:17px;font-weight:700;letter-spacing:-.2px}
.one{color:var(--muted);font-size:13.5px;margin:-6px 0 14px}
.card.stage-card{border-color:rgba(255,255,255,.35);box-shadow:inset 0 1px 0 var(--hi),0 0 0 3px rgba(255,255,255,.06),var(--shadow)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
.stack{display:flex;flex-direction:column;gap:8px}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 7px;letter-spacing:.2px;text-transform:uppercase}
.lbl:first-child{margin-top:0}
textarea,.field{width:100%;border:1px solid var(--line);border-radius:16px;background:var(--field);font-size:16px;color:var(--text)}
textarea::placeholder,.field::placeholder{color:var(--dim)}
textarea{padding:13px 14px;resize:vertical;line-height:1.5}
.field{min-height:var(--tap);padding:0 14px}
select.field option{background:#1A1B1F;color:var(--text)}
textarea:focus,.field:focus{outline:none;border-color:rgba(255,255,255,.35);box-shadow:0 0 0 3px rgba(255,255,255,.08)}
#editor{min-height:300px}
#stagingText{min-height:180px}
.hint{font-size:13px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:2px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--glass-2);color:var(--text);border:1px solid var(--line);white-space:nowrap}
.badge.ok{background:rgba(74,222,128,.14);color:#86EFAC;border-color:rgba(74,222,128,.25)}
.badge.off{background:var(--glass);color:var(--muted)}
.badge.warn{background:rgba(251,191,36,.14);color:#FCD34D;border-color:rgba(251,191,36,.28)}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.warnbox{background:rgba(251,191,36,.10);color:#FDE68A;border:1px solid rgba(251,191,36,.28);border-radius:16px;padding:11px 13px;font-size:13.5px}
.warnbox b{color:#FEF3C7}
.warnbox .chars,.infobox .chars{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chars span{background:var(--field);border:1px solid var(--line-2);border-radius:8px;padding:2px 8px;font-size:15px;min-width:28px;text-align:center;color:var(--text)}
.infobox{background:var(--glass);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:11px 13px;font-size:13.5px}
.progress{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .2s}
.progress.thin{height:4px}
.radio{display:flex;gap:12px;align-items:center;min-height:60px;padding:10px 14px;border:1px solid var(--line);border-radius:18px;background:var(--glass);cursor:pointer;transition:background .15s,border-color .15s}
.radio input{-webkit-appearance:none;appearance:none;width:22px;height:22px;margin:0;flex:none;border-radius:50%;border:2px solid var(--line-2);background:transparent;transition:border-color .15s,background .15s}
.radio input:checked{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 5px,transparent 5.5px)}
.radio.on{border-color:rgba(255,255,255,.45);background:var(--glass-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
.radio.disabled{opacity:.45}
.radio b{font-weight:600}
.radio small{display:block;color:var(--muted);font-size:13px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:50px;height:50px;border-radius:50%;border:2px solid transparent;background:transparent;padding:0;display:grid;place-items:center}
.swatch i{display:block;width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.swatch.on{border-color:var(--accent)}
.switch{display:flex;align-items:center;gap:12px;min-height:var(--tap);cursor:pointer;font-size:15px}
.switch input{width:24px;height:24px;accent-color:var(--accent);flex:none;margin:0}
.checks{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.checks:empty{display:none}
.checks li{display:flex;gap:8px;font-size:13.5px;align-items:flex-start}
.checks li .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#0B0C0E;font-size:12px;font-weight:800;background:var(--ok);margin-top:1px}
.checks li.bad .ic{background:var(--err)}.checks li.warn .ic{background:var(--warn)}
.checks li small{display:block;color:var(--muted);font-size:12px;word-break:break-word}
details.fold{border-top:1px solid var(--line);margin:16px -18px -18px;padding:0 18px}
details.fold:not(:last-child){margin-bottom:0}
details.fold+details.fold{margin-top:0}
details.fold>summary{list-style:none;min-height:50px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--text)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);transition:transform .15s}
details.fold[open]>summary::after{transform:rotate(-135deg)}
details.fold>.fold-body{padding:0 0 18px}
pre.log{white-space:pre-wrap;word-break:break-word;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0 0;font:11.5px/1.45 ui-monospace,Menlo,monospace;color:var(--muted);min-height:20px}
pre.log:empty{display:none}

/* Handschrift-Kacheln: 6er-Raster aus Glas, fertige Zeichen mit grünem Rahmen und Punkt */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.tile{position:relative;aspect-ratio:1;min-height:var(--tap);border:1px solid var(--line);border-radius:16px;background:var(--glass);display:grid;place-items:center;padding:0;font-size:22px;color:var(--dim);overflow:hidden}
.tile:hover{background:var(--glass-2)}
.tile.done{border:1.5px solid rgba(74,222,128,.55);background:rgba(74,222,128,.06);color:var(--text)}
.tile.done::after{content:"";position:absolute;right:7px;bottom:7px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.tile .lab{position:absolute;left:7px;top:4px;font-size:10.5px;color:var(--muted);font-weight:600}
.tile svg.pv{width:74%;height:74%;margin-top:6px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px;font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.grp-h span{font-weight:500;color:var(--dim);font-size:12.5px;text-transform:none}

/* ---------- Chat ---------- */
#panel[data-mode=chat]{overflow:hidden;padding-bottom:2px}
#panel[data-mode=chat]>section[data-panel=chat]{height:100%}
.chat-card{height:100%;min-height:0;display:flex;flex-direction:column;padding-bottom:12px}
.chat-log{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px;padding:4px 2px 10px;margin:0 -4px}
.chat-empty{margin:auto;max-width:360px;text-align:center;display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:14px;padding:20px}
.chat-empty b{color:var(--text);font-size:16px}
.msg{display:flex;flex-direction:column;max-width:88%}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.ai{align-self:flex-start}
.bub{padding:11px 15px;border-radius:20px;white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.45}
.msg.me .bub{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:6px}
.msg.ai .bub{background:var(--glass-2);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.sys .bub{background:rgba(251,191,36,.10);border-color:rgba(251,191,36,.28);color:#FDE68A}
.bub b.h{font-size:16.5px}
.bub .sk{display:inline-block;margin:2px 0;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.10);border:1px dashed var(--line-2);font-size:13.5px}
.by{font-size:11.5px;color:var(--dim);margin:4px 8px 0}
.msg-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:var(--tap);padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--text);font-weight:600;font-size:14px;white-space:nowrap}
.chip:hover{background:var(--glass-2)}
.composer{display:flex;align-items:flex-end;gap:8px;padding:6px;border-radius:24px;background:var(--field);border:1px solid var(--line)}
.composer textarea{flex:1;min-height:var(--tap);max-height:160px;border:0;background:transparent;resize:none;padding:11px 6px;box-shadow:none}
.composer textarea:focus{box-shadow:none}
.composer .btn{border-radius:999px}
.composer .icon-btn{background:var(--glass)}

/* ---------- Vorschau: Glas-Bühne, darauf das weiße Blatt ---------- */
.stage{flex:1 1 auto;min-width:0;min-height:0;position:relative;display:flex;flex-direction:column;border-radius:32px;overflow:hidden;background:rgba(255,255,255,.03) radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.3px) 0 0/22px 22px;border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi)}
.sheet-scroll{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;padding:28px 28px 100px;touch-action:pan-x pan-y;overscroll-behavior:contain}
.sheet{margin:auto;flex:none;background:#fff;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 24px 60px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.35);position:relative}
.sheet canvas{display:block;width:100%;height:100%;border-radius:6px}
.pill{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;border-radius:999px;padding:5px;z-index:5;background:var(--glass-strong)}
.pill .icon-btn{border-radius:50%}
.pill .lab{min-width:84px;height:var(--tap);border:0;background:transparent;border-radius:999px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;padding:0 8px;color:var(--text)}
.pill .lab:hover{background:var(--glass-2)}
.pill span.lab{display:grid;place-items:center;min-width:64px}
.pill .sep{width:1px;height:24px;background:var(--line-2);margin:0 4px}

/* ---------- Info-Popover ---------- */
.pop{position:fixed;z-index:400;width:min(360px,calc(100vw - 24px));background:var(--glass-strong);border-radius:20px;padding:15px 17px;font-size:13.5px;color:var(--muted)}
.pop h4{font-size:14.5px;color:var(--text);margin-bottom:7px}
.pop p{margin:0 0 8px}.pop p:last-child{margin:0}
.pop b{color:var(--text)}
.pop ul,.pop ol{margin:0 0 8px;padding-left:18px}.pop li{margin:3px 0}
.pop code{background:rgba(255,255,255,.08);border-radius:6px;padding:1px 6px;font-size:12.5px;color:var(--text)}

/* ---------- Modale Fenster ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.modal-card{background:var(--glass-strong);border-radius:28px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:inset 0 1px 0 var(--hi),0 30px 90px rgba(0,0,0,.6)}
.modal-card.wide{width:min(1080px,100%);height:min(820px,100%)}
.modal-card.mid{width:min(780px,100%)}
.modal-head{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 22px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:18px;font-weight:700;flex:1;min-width:0}
.modal-head h2 small{font-weight:500;color:var(--muted);font-size:13.5px;margin-left:6px}
.modal-body{padding:18px 22px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
.modal-body h4{margin:18px 0 6px;font-size:14.5px}
.modal-body h4:first-child{margin-top:0}
.modal-body p,.modal-body li{font-size:14px;color:var(--muted)}
.modal-body b{color:var(--text)}
.modal-body ul,.modal-body ol{margin:6px 0;padding-left:20px}
.modal-body li{margin:3px 0}
.modal-body code{background:rgba(255,255,255,.08);border-radius:6px;padding:1px 6px;font-size:12.5px;color:var(--text)}
.modal-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line)}

/* Zuschneiden */
.crop-stage{flex:1 1 auto;min-height:0;background:#050506;display:grid;place-items:center;overflow:hidden;position:relative;touch-action:none;-webkit-user-select:none;user-select:none}
.crop-wrap{position:relative;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.btn-primary::after,.btn-amber::after,.rail nav .glider::after{background:linear-gradient(105deg,transparent 30%,rgba(11,12,14,.07) 42%,rgba(255,255,255,1) 50%,rgba(11,12,14,.07) 58%,transparent 70%)}
